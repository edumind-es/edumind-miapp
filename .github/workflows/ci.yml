name: edumind-miapp-ci

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Audit backend dependencies (pip-audit)
        run: |
          source .venv/bin/activate
          pip install pip-audit
          pip-audit -r requirements.txt --strict

      - name: Run backend tests
        run: |
          source .venv/bin/activate
          env -u DEBUG \
            PYTHONPATH=. \
            SECRET_KEY=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            RUNTIME_ENV=development \
            DATABASE_URL=sqlite:///./test_ci.db \
            DB_AUTO_CREATE=true \
            DB_MANAGED_BY_ALEMBIC=false \
            DB_ENABLE_SQLITE_WAL=false \
            pytest -q

      - name: Check migrations head
        run: |
          source .venv/bin/activate
          env -u DEBUG \
            PYTHONPATH=. \
            SECRET_KEY=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            RUNTIME_ENV=development \
            DATABASE_URL=sqlite:///./test_ci_migrations.db \
            DB_AUTO_CREATE=false \
            DB_MANAGED_BY_ALEMBIC=true \
            python scripts/run_migrations.py upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      # Pasa a bloqueante (sin continue-on-error) cuando react-router esté en >= 7.17
      - name: Audit frontend dependencies (npm audit)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
