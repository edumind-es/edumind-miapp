# app.edumind.es -> canonical miapp.edumind.es

server {
    server_name app.edumind.es;
    server_tokens off;

    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/app.edumind.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.edumind.es/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://miapp.edumind.es$request_uri;
}

server {
    listen 80;
    server_name app.edumind.es;
    return 301 https://miapp.edumind.es$request_uri;
}
