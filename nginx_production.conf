# EDUmind AI Pro - Nginx Configuration
# Save as: /etc/nginx/sites-available/edumind-ai-pro

server {
    server_name miapp.edumind.es;
    server_tokens off;

    # SSL Configuration (Certbot Managed)
    listen 443 ssl http2; 
    ssl_certificate /etc/letsencrypt/live/miapp.edumind.es/fullchain.pem; 
    ssl_certificate_key /etc/letsencrypt/live/miapp.edumind.es/privkey.pem; 
    include /etc/letsencrypt/options-ssl-nginx.conf; 
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; 

    # Compression for mobile/tablet clients
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/x-javascript
        text/javascript
        application/xml
        text/xml
        image/svg+xml;

    etag on;

    # --- Frontend (React SPA) ---
    root /var/www/edumind_miapp/frontend/dist;
    index index.html;

    # Cache-busted build assets (long cache)
    location /assets/ {
        try_files $uri =404;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Static data with medium cache
    location /data/ {
        try_files $uri =404;
        expires 24h;
        add_header Cache-Control "public, max-age=86400";
    }

    # SPA shell must be revalidated to pick up new deployments
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # --- Backend API Proxy ---
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8100/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Nunca reenviar la IP que declare el cliente: solo la que ve nginx
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Streaming / SSE Support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; worker-src 'self' blob:; media-src 'self' blob:;" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    
    # Request size limit
    client_max_body_size 10M;
}

server {
    if ($host = miapp.edumind.es) {
        return 301 https://$host$request_uri;
    } 

    listen 80;
    server_name miapp.edumind.es;
    return 404; 
}
