<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>En obras · miapp.edumind.es</title>
  <meta name="description" content="La aplicación EDUmind está en proceso de mejora. Volvemos pronto." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0b0f1a;
      --surface:  #131929;
      --border:   rgba(99,179,237,0.15);
      --accent:   #4f8ef7;
      --accent2:  #6ee7b7;
      --text:     #e2e8f0;
      --muted:    #718096;
      --radius:   20px;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    /* ── Animated gradient background ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%,  rgba(79,142,247,.18) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 80%,  rgba(110,231,183,.12) 0%, transparent 55%),
        radial-gradient(ellipse 40% 40% at 50% 50%,  rgba(79,142,247,.06) 0%, transparent 70%);
      animation: bgPulse 8s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes bgPulse {
      from { opacity: .7; }
      to   { opacity: 1; }
    }

    /* ── Centering container ── */
    .scene {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 3rem 3.5rem;
      max-width: 540px;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(12px);
      box-shadow:
        0 0 0 1px rgba(79,142,247,.08),
        0 24px 64px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(255,255,255,.04);
      animation: cardIn .6s cubic-bezier(.22,1,.36,1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(28px) scale(.97); }
      to   { opacity: 1; transform: translateY(0)   scale(1); }
    }

    /* ── Logo / brand mark ── */
    .logo-wrap {
      display: inline-flex;
      align-items: center;
      gap: .6rem;
      margin-bottom: 2.5rem;
      padding: .55rem 1.1rem;
      background: rgba(79,142,247,.1);
      border: 1px solid rgba(79,142,247,.2);
      border-radius: 100px;
    }

    .logo-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 0 8px rgba(79,142,247,.7);
      animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink {
      0%,100% { opacity: 1;   box-shadow: 0 0 8px  rgba(79,142,247,.7); }
      50%      { opacity: .4; box-shadow: 0 0 20px rgba(79,142,247,.4); }
    }

    .logo-text {
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--accent);
    }

    /* ── Icon ── */
    .icon-wrap {
      width: 88px; height: 88px;
      margin: 0 auto 1.8rem;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(79,142,247,.15), rgba(110,231,183,.1));
      border: 1px solid rgba(79,142,247,.2);
      display: flex; align-items: center; justify-content: center;
      animation: iconFloat 4s ease-in-out infinite;
    }

    @keyframes iconFloat {
      0%,100% { transform: translateY(0);   }
      50%      { transform: translateY(-7px); }
    }

    .icon-wrap svg { width: 42px; height: 42px; }

    /* ── Headline ── */
    h1 {
      font-size: 2rem;
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: -.03em;
      background: linear-gradient(135deg, #fff 30%, var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: .9rem;
    }

    .subtitle {
      font-size: 1rem;
      font-weight: 400;
      color: var(--muted);
      line-height: 1.65;
      margin-bottom: 2.2rem;
    }

    .subtitle strong {
      color: var(--text);
      font-weight: 600;
    }

    /* ── Progress bar ── */
    .progress-track {
      background: rgba(255,255,255,.06);
      border-radius: 100px;
      height: 6px;
      overflow: hidden;
      margin-bottom: 2.2rem;
    }

    .progress-fill {
      height: 100%;
      border-radius: 100px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      width: 0%;
      animation: progressAnim 2.2s 0.5s cubic-bezier(.22,1,.36,1) forwards;
      box-shadow: 0 0 12px rgba(79,142,247,.5);
    }

    @keyframes progressAnim {
      to { width: 72%; }
    }

    /* ── Tags ── */
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: .6rem;
      justify-content: center;
      margin-bottom: 2.5rem;
    }

    .tag {
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: .35rem .85rem;
      border-radius: 100px;
      border: 1px solid rgba(110,231,183,.2);
      color: var(--accent2);
      background: rgba(110,231,183,.05);
    }

    /* ── Footer link ── */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      font-size: .88rem;
      font-weight: 500;
      color: var(--muted);
      text-decoration: none;
      transition: color .2s;
    }

    .back-link:hover { color: var(--accent); }
    .back-link svg { width: 14px; height: 14px; }

    /* ── Particles (CSS only) ── */
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0;
      animation: rise var(--dur, 12s) var(--delay, 0s) ease-in infinite;
    }

    @keyframes rise {
      0%   { transform: translateY(110vh) scale(0);   opacity: 0; }
      10%  { opacity: .35; }
      90%  { opacity: .1; }
      100% { transform: translateY(-10vh)  scale(1.5); opacity: 0; }
    }

    /* Responsive */
    @media (max-width: 480px) {
      .card { padding: 2.2rem 1.8rem; }
      h1    { font-size: 1.65rem; }
    }
  </style>
</head>
<body>

  <!-- Floating particles -->
  <div class="particles" aria-hidden="true">
    <div class="particle" style="left:8%;  width:4px;  height:4px;  --dur:14s; --delay:0s;"></div>
    <div class="particle" style="left:22%; width:3px;  height:3px;  --dur:18s; --delay:2s;  background:var(--accent2);"></div>
    <div class="particle" style="left:40%; width:5px;  height:5px;  --dur:11s; --delay:4s;"></div>
    <div class="particle" style="left:58%; width:3px;  height:3px;  --dur:16s; --delay:1s;  background:var(--accent2);"></div>
    <div class="particle" style="left:74%; width:4px;  height:4px;  --dur:13s; --delay:3s;"></div>
    <div class="particle" style="left:88%; width:3px;  height:3px;  --dur:17s; --delay:5s;  background:var(--accent2);"></div>
  </div>

  <main class="scene" role="main">
    <div class="card">

      <!-- Brand badge -->
      <div class="logo-wrap" aria-label="EDUmind">
        <span class="logo-dot"></span>
        <span class="logo-text">EDUmind</span>
      </div>

      <!-- Icon: wrench / construction -->
      <div class="icon-wrap" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="url(#iconGrad)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <defs>
            <linearGradient id="iconGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#4f8ef7"/>
              <stop offset="100%" stop-color="#6ee7b7"/>
            </linearGradient>
          </defs>
          <!-- Helmet -->
          <path d="M2 20h20"/>
          <path d="M12 2a8 8 0 0 1 8 8H4a8 8 0 0 1 8-8z"/>
          <rect x="3" y="10" width="18" height="4" rx="1"/>
        </svg>
      </div>

      <h1>En obras</h1>

      <p class="subtitle">
        Estamos trabajando para mejorar la aplicación.<br />
        <strong>Volvemos en unos días</strong> con una versión
        más rápida y fiable.
      </p>

      <!-- Progress bar decoration -->
      <div class="progress-track" role="progressbar" aria-valuenow="72" aria-valuemin="0" aria-valuemax="100" aria-label="Progreso de las mejoras">
        <div class="progress-fill"></div>
      </div>

      <!-- Tags -->
      <div class="tags">
        <span class="tag">Mejoras en curso</span>
        <span class="tag">Volvemos pronto</span>
        <span class="tag">miapp.edumind.es</span>
      </div>

      <!-- Back to main site -->
      <a href="https://edumind.es" class="back-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M19 12H5M12 5l-7 7 7 7"/>
        </svg>
        Volver a edumind.es
      </a>

    </div>
  </main>

</body>
</html>
